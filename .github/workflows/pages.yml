name: Deploy public Sci-Map to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "ledger/**"
      - "tools/**"
      - "build_index.py"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: sci-map-pages-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout public software repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify source tests
        run: |
          python -m unittest discover -s tests -v
          node tests/test_search.cjs
          node tests/test_private_import.cjs
          python tools/ledger.py validate

      - name: Build public-only static site
        shell: bash
        run: |
          python tools/ledger.py build --output _public_catalog.json
          python - <<'PY'
          from pathlib import Path
          import json

          src = Path("web")
          out = Path("_site")
          (out / "data").mkdir(parents=True, exist_ok=True)

          # Explicit allowlist. Only the public, CC-BY ledger under ledger/ is published.
          # A local web/data/merged.json, private ledger, archive or manifest is never copied.
          for name in ("style.css", "app.js"):
              (out / name).write_bytes((src / name).read_bytes())

          (out / "index.html").write_bytes((src / "index.html").read_bytes())

          catalog = json.loads(Path("_public_catalog.json").read_text(encoding="utf-8"))
          assert catalog["data_policy"] == "PUBLIC_LEDGER_CC_BY_4_0"
          assert all(r.get("ledger_path", "").startswith("ledger/") for r in catalog["records"])
          (out / "data" / "merged.json").write_text(json.dumps(catalog, ensure_ascii=False), encoding="utf-8")
          (out / ".nojekyll").write_text("", encoding="utf-8")
          assert set(p.relative_to(out).as_posix() for p in out.rglob("*") if p.is_file()) == {
              "index.html", "app.js", "style.css", "data/merged.json", ".nojekyll"
          }
          print(f"Public Pages artifact prepared; public ledger records = {len(catalog['records'])}")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
