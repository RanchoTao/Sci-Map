name: Verify private cloud software and public artifact boundaries

on:
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - "web/**"
      - "data/catalog.json"
      - "tests/**"
      - "*.py"
      - ".github/workflows/private-cloud.yml"
  pull_request:
    paths:
      - "cloud/**"
      - "web/**"
      - "data/catalog.json"
      - "tests/**"
      - "*.py"
      - ".github/workflows/private-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-cloud-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public software only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install locked cloud dependencies
        working-directory: cloud
        run: npm ci

      - name: Typecheck server without output
        working-directory: cloud
        run: npx --no-install tsc --noEmit

      - name: Build server only
        working-directory: cloud
        run: npm run build

      - name: Run isolated cloud tests
        working-directory: cloud
        run: npm test

      - name: Audit public source and generated Pages artifact
        working-directory: cloud
        run: |
          npm run audit
          node scripts/audit-public.mjs --self-test

      - name: Preserve local and Pages regressions
        run: |
          python -m unittest discover -s tests -v
          node tests/test_search.cjs
          node tests/test_private_import.cjs

      # This workflow does not access Research-Archive, use deployment secrets,
      # publish artifacts, deploy Vercel, or start scientific execution.
