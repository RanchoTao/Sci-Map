name: Tests and ledger checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_search.cjs
      - run: node tests/test_private_import.cjs
      - name: Validate public ledger
        run: python tools/ledger.py validate

  reproduce:
    # Runs contributors' cheap CPU-only repro commands for records touched by a PR.
    # No secrets, read-only token, hard timeouts. Results go to the job summary;
    # evidence levels are never upgraded automatically.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reproduce changed records
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- ledger/ || true)
          echo "Changed ledger files: $changed"
          if [ -z "$changed" ]; then echo "No ledger changes." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          python tools/ledger.py repro --files $changed --report "$GITHUB_STEP_SUMMARY"
