<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Research Atlas · 私有科研地图</title><link rel="stylesheet" href="style.css"></head>
<body><aside><div class="brand">◈ <strong>RESEARCH ATLAS</strong><span>RANCHO · 科研资产地图</span></div><nav aria-label="地图视图"><button class="active" data-view="list">研究记录</button><button data-view="timeline">来源时间线</button><button data-view="graph">关系图</button><button data-view="review">重复与冲突待审</button><button data-view="inventory">来源清单</button></nav><p class="policy">PRIVATE · LOCAL<br>轻量目录保留课题与结果、依据摘录及来源哈希。原始流程和实验数据不迁移。来源记载与独立复现分开标注。</p></aside>
<main><header><div class="eyebrow">EVIDENCE BEFORE VERDICT</div><h1>每一条探索，都有出处。</h1><p>检索问题、实验、失败条件和原始证据。保留不同机器与不同版本的判断。</p><div id="load-state" role="status">正在读取本地索引…</div></header><section id="metrics" class="metrics" aria-label="索引统计"></section><section class="filters"><label class="search">全文检索<input id="query" type="search" placeholder="研究问题 / 假设 / 失败原因 / 文件内容"></label><label>领域<select id="domain"><option value="">全部领域</option></select></label><label>项目<select id="project"><option value="">全部项目</option></select></label><label>状态<select id="status"><option value="">全部状态</option></select></label><label>来源机器<select id="machine"><option value="">全部机器</option></select></label><label>标签<select id="tag"><option value="">全部标签</option></select></label></section><div class="view-head"><h2 id="view-title">研究记录</h2><span id="result-count"></span><button id="export">导出当前候选 JSON</button></div><section id="results" aria-live="polite"></section><div class="pagination"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div><footer>“失败”仅适用于证据所声明的假设与条件。未审阅来源不计为已核实课题。</footer></main>
<dialog id="details"><button class="close" id="close" aria-label="关闭">×</button><div id="details-body"></div></dialog><script src="app.js" defer></script></body></html>
